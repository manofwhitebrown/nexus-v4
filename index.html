<script type="text/nx-defer">
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NS=location.pathname.replace(/[^\/]*$/,''),K='nexus.data'+NS,APP_VERSION='4.0.0';let D={items:[],projects:[],log:[],study:[]},S={tab:'home',skip:0,pj:null,col:null,type:'auto'};
let OK=0;try{const r=JSON.parse(localStorage.getItem(K)||'{}');if(r&&typeof r==='object')D={items:Array.isArray(r.items)?r.items:[],projects:Array.isArray(r.projects)?r.projects:[],log:Array.isArray(r.log)?r.log:[],study:Array.isArray(r.study)?r.study:[],rules:Array.isArray(r.rules)?r.rules:[]};OK=1}catch(e){}
const LB=D.log.length;{const ids=new Set(D.items.map(x=>x.id));D.log=D.log.filter(l=>ids.has(l.id))}
const TH='nexus.theme'+NS,th=()=>{try{return localStorage.getItem(TH)||'dark'}catch(e){return'dark'}};
const applyTh=()=>{const v=th(),t=v==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):v==='light'?'light':'dark';document.documentElement.setAttribute('data-theme',t);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#E9E8E4':'#0D0D0E'};applyTh();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D));return 1}catch(e){toast('Storage is full or blocked. Export a backup in Settings.');return 0}};
try{if(OK&&D.log.length!==LB)save()}catch(e){}
const now=()=>new Date().toISOString(),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const dk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return dk(d)};
/* Add whole months without skipping one: Jan 31 + 1 month is Feb 28 (or 29), not Mar 3 */
const addMo=(d,n)=>{const r=new Date(d.getFullYear(),d.getMonth()+n,1,d.getHours(),d.getMinutes());r.setDate(Math.min(d.getDate(),new Date(r.getFullYear(),r.getMonth()+1,0).getDate()));return r};
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/6e4);if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.floor(m/60);if(h<24)return h+' h ago';const d=Math.floor(h/24);return d<7?d+' d ago':new Date(iso).toLocaleDateString(undefined,{day:'numeric',month:'short'})};
const dom=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}};
const safeUrl=u=>{u=String(u||'').trim();if(!u||u.length>2000)return'';try{const x=new URL(/^https?:\/\//i.test(u)?u:'https://'+u);if(!/^https?:$/.test(x.protocol)||x.username||x.password||!x.hostname.includes('.'))return'';return x.href}catch(e){return''}};
const pl=(n,w)=>n+' '+w+(n===1?'':'s');
const pname=i=>(D.projects.find(p=>p.id===i)||{}).name||'';
const get=i=>D.items.find(x=>x.id===i);
const logA=(k,it)=>{D.log.push({t:now(),k,id:it.id,ti:String(it.title||'Untitled').slice(0,80),ty:it.type});if(D.log.length>400)D.log.splice(0,D.log.length-400)};
function toast(msg,act,fn){const t=$('#toast');t.innerHTML='<span>'+E(msg)+'</span>'+(act?'<button>'+E(act)+'</button>':'');t.style.display='flex';if(act)t.querySelector('button').onclick=()=>{fn();t.style.display='none'};clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',5000)}
function parse(t,force){t=String(t||'').trim().slice(0,5000);if(!t)return null;const o=t;let url='';const m=t.match(/\b(?:https?:\/\/|www\.)[^\s]+/i);
if(m){const u=safeUrl(m[0].replace(/[.,;:!?)]+$/,''));if(u){url=u;t=t.replace(m[0],' ')}}
const tags=[];t=t.replace(/(^|\s)#([\p{L}\p{M}\p{N}_-]{1,30})/gu,(a,s,x)=>{tags.push(x.toLowerCase());return s});
let project=null;t=t.replace(/(^|\s)@([\p{L}\p{M}\p{N}_-]{1,60})/gu,(a,s,n)=>{const p=D.projects.find(p=>p.name.toLowerCase().replace(/\s/g,'').startsWith(n.toLowerCase()));if(p&&!project){project=p.id;return s}return a});
if(!project)for(const p of D.projects)if(p.name.length>2&&t.toLowerCase().includes(p.name.toLowerCase())){project=p.id;break}
t=t.replace(/\s+/g,' ').trim();const tp=/^(todo|task|remind me to|remind me|reminder)\b[:\s-]*/i,ip=/^idea\b[:\s-]*/i,np=/^note\b[:\s-]*/i;
const type=force||(tp.test(t)?'task':ip.test(t)?'idea':np.test(t)?'note':url&&t.length<200?'link':/\b(i'll|i will|i need to|i have to|need to)\b/i.test(t)&&t.length<160?'task':'note');
t=t.replace(tp,'').replace(ip,'').replace(np,'').trim();
const promise=type==='task'&&/\b(i'll|i will|remind me|promised?|get back to)\b/i.test(o);
const due=type==='task'?(/\btomorrow\b/i.test(t)?addD(1):/\b(today|tonight)\b/i.test(t)?dk():null):null;
let title=t.slice(0,120),body=t.length>120?t.slice(120):'';if(!title&&url)title=dom(url);if(!title&&tags.length)title='#'+tags[0];
return{type,title,body,url,tags:[...new Set(tags)].slice(0,10),project,due,promise}}
function addItem(p){if(!p||(!p.title&&!p.url))return null;if(D.items.length>=5000){toast('Limit of 5,000 items reached.');return null}
const it={id:uid(),type:p.type,title:p.title,body:p.body||'',url:p.url||'',project:p.project||null,tags:p.tags||[],done:false,doneAt:null,due:p.due||null,promise:!!p.promise,media:p.media||null,created:now(),updated:now()};
D.items.push(it);logA('created',it);save();return it}
function upd(i,patch){const it=get(i);if(!it)return;const was=it.done;Object.assign(it,patch,{updated:now()});if(patch.done===true&&!was){it.doneAt=now();logA('done',it)}else if(patch.done===false)it.doneAt=null;else logA('updated',it);
const l=D.log;if(l.length>1&&l[l.length-1].k==='updated'&&l[l.length-2].k==='updated'&&l[l.length-2].id===i)l.splice(l.length-2,1);save()}
const dueL=d=>!d?'':d===dk()?'due today':d===addD(1)?'due tomorrow':d<dk()?'from '+new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}):'due '+new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'});
const meta=i=>[i.media?i.media.kind:'',pname(i.project),i.type==='link'?dom(i.url):'',i.type==='task'&&!i.done?dueL(i.due):'',i.promise&&!i.done?'promised':'',i.type!=='task'?ago(i.updated):''].filter(Boolean).join(', ');
const row=i=>`<li class="row">${i.type==='task'?`<button class="ck" role="checkbox" aria-checked="${!!i.done}" aria-label="Mark done: ${E(i.title)}" data-a="done" data-i="${i.id}"><i></i></button>`:''}<button class="rm" data-a="open" data-i="${i.id}"><b class="${i.done?'dn':''}">${E(i.title||dom(i.url)||'Untitled')}</b><small class="${i.due&&i.due<dk()&&!i.done?'late':''}">${E(meta(i))}</small></button></li>`;
const list=a=>a.length?`<ul>${a.map(row).join('')}</ul>`:'';
const sec=(t,h)=>h?`<h2>${E(t)}</h2>${h}`:'';
const words=s=>new Set((String(s).toLowerCase().match(/[a-z0-9\u0900-\u0c7f]{4,}/g)||[]));
function rel(a,b){let s=0,r='';if(a.project&&a.project===b.project){s+=4;r='Same project: '+pname(a.project)}const t=a.tags.filter(x=>b.tags.includes(x));if(t.length){s+=3*t.length;r=r||'Shares #'+t[0]}const wa=words(a.title),w=[...words(b.title)].filter(x=>wa.has(x));if(w.length){s+=Math.min(3,w.length);r=r||'Both mention "'+w[0]+'"'}return{s,r}}
let related=(it)=>D.items.filter(o=>o.id!==it.id).map(o=>({o,...rel(it,o)})).filter(x=>x.s>=2).sort((a,b)=>b.s-a.s).slice(0,5);
const COL={'Unfinished':i=>i.type==='task'&&!i.done,'Overdue':i=>i.type==='task'&&!i.done&&i.due&&i.due<dk(),'Saved for later':i=>i.type==='link','Ideas':i=>i.type==='idea','This week':i=>Date.now()-new Date(i.updated)<6048e5,'Untouched for 30 days':i=>!i.done&&Date.now()-new Date(i.updated)>2592e6};
function cols(){const c={...COL},n={};D.items.forEach(i=>i.tags.forEach(t=>n[t]=(n[t]||0)+1));Object.entries(n).filter(e=>e[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,5).forEach(([t])=>c['#'+t]=i=>i.tags.includes(t));return c}
function search(q){const tk=q.toLowerCase().split(/\s+/).filter(Boolean).slice(0,6),pr=D.projects.filter(p=>tk.every(t=>p.name.toLowerCase().includes(t)));
const it=[];for(const i of D.items){const ti=i.title.toLowerCase(),bo=i.body.toLowerCase(),tg=i.tags.join(' '),pn=pname(i.project).toLowerCase();let sc=0,ok=1;for(const t of tk){let s=0;if(ti.includes(t))s+=4;if(tg.includes(t))s+=3;if(pn.includes(t))s+=2;if(bo.includes(t)||i.url.toLowerCase().includes(t))s+=1;if(!s){ok=0;break}sc+=s}if(ok)it.push({i,sc})}
it.sort((a,b)=>b.sc-a.sc||b.i.updated.localeCompare(a.i.updated));return{pr,it:it.slice(0,60).map(x=>x.i)}}
const nav=[['home','Home'],['tasks','Tasks'],['notes','Notes'],['study','Study'],['browse','Browse']];
function render(){const q=$('#q').value.trim(),m=$('#m');$('#nv').innerHTML=nav.map(([k,l])=>`<button data-a="tab" data-i="${k}" ${S.tab===k&&!q?'aria-current="page"':''}>${l}</button>`).join('');

if(q){const r=search(q);let h='<h1>Results</h1><p><a href="https://www.google.com/search?q='+encodeURIComponent(q)+'" target="_blank" rel="noopener noreferrer">Search the web for &ldquo;'+E(q.slice(0,60))+'&rdquo;</a></p>';if(!r.pr.length&&!r.it.length)h+='<p class="mu">Nothing matches. Press Enter to save it as a note, or start with task, idea or focus 25.</p>';
if(r.pr.length)h+=sec('Projects','<ul>'+r.pr.map(p=>`<li class="row"><button class="rm" data-a="proj" data-i="${p.id}"><b>${E(p.name)}</b></button></li>`).join('')+'</ul>');
[['task','Tasks'],['note','Notes'],['link','Saved'],['idea','Ideas']].forEach(([t,l])=>h+=sec(l,list(r.it.filter(i=>i.type===t))));m.innerHTML=h;return}
m.innerHTML=({home,tasks,notes,browse,time,study}[S.tab])()+foot()}
const foot=()=>`<footer style="margin-top:44px;padding-top:14px;border-top:1px solid var(--ln)" class="mu"><a href="privacy.html">Privacy</a> &nbsp; <a href="terms.html">Terms</a><small style="margin-top:6px">&copy; ${new Date().getFullYear()} Nexus. Your data stays on this device.</small></footer>`;
function empty(t,b){return`<div style="margin-top:28px"><b style="font-size:21px">${E(t)}</b><p class="mu">${E(b)}</p></div>`}
function home(){const h=new Date().getHours(),td=dk(),T=D.items.filter(i=>i.type==='task'&&!i.done);const rk=t=>t.due&&t.due<td?0:t.due===td?1:t.promise?2:t.due?3:4;
T.sort((a,b)=>rk(a)-rk(b)||(a.due||'9').localeCompare(b.due||'9')||a.created.localeCompare(b.created));const n=T.length,st=n?S.skip%n:0,O=n?[...T.slice(st),...T.slice(0,st)]:[],nt=O[0];

delp:i=>{const p=D.projects.find(x=>x.id===i);if(confirm('Delete '+p.name+'? Its items stay in Nexus without a project.')){D.projects=D.projects.filter(x=>x.id!==i);D.items.forEach(x=>{if(x.project===i)x.project=null});S.pj=null;save();render();toast('Project deleted')}}};

let PM=null,rec=null;
let IDBP=null;
const idb=()=>IDBP||(IDBP=new Promise((res,rej)=>{const r=indexedDB.open('nexus-media'+NS,1);r.onupgradeneeded=()=>r.result.createObjectStore('b');r.onsuccess=()=>{r.result.onversionchange=()=>{r.result.close();IDBP=null};res(r.result)};r.onerror=()=>{IDBP=null;rej(r.error)}}));
const bput=async(k,b)=>{const v=window.NXVault?await NXVault.rec.seal('media',b):b,d=await idb();return new Promise((res,rej)=>{const t=d.transaction('b','readwrite');t.objectStore('b').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const bget=async k=>{const d=await idb(),r=await new Promise((res,rej)=>{const q=d.transaction('b').objectStore('b').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});return window.NXVault&&r?NXVault.rec.open('media',r):r};
if(window.NXVault)NXVault.addMigrator('attachments',async dir=>{const d=await idb(),keys=await new Promise((res,rej)=>{const q=d.transaction('b').objectStore('b').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
  for(const k of keys){const r=await new Promise((res,rej)=>{const q=d.transaction('b').objectStore('b').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});const n=dir==='seal'?await NXVault.rec.seal('media',r):await NXVault.rec.open('media',r);
    if(n!==r)await new Promise((res,rej)=>{const t=d.transaction('b','readwrite');t.objectStore('b').put(n,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}});
async function shrink(f){try{const b=await createImageBitmap(f),s=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(x=>r(x||f),'image/jpeg',.82))}catch(e){return f}}
function mediaUI(cb){const info=$('#mi');const set=async(blob,kind,name)=>{if(blob.size>8e6){info.textContent='That file is over 8 MB.';return}try{const id=uid();await bput(id,blob);cb({id,kind,name:String(name).slice(0,80),mime:blob.type});info.textContent='Attached '+kind+': '+name}catch(e){info.textContent='Could not store that file on this device.'}};
const pick=(accept,kind)=>{const f=document.createElement('input');f.type='file';f.accept=accept;f.onchange=async()=>{let x=f.files[0];if(!x)return;const nm=x.name||kind;if(kind==='photo'&&x.type.startsWith('image/'))x=await shrink(x);set(x,kind,nm)};f.click()};
$('#mp').onclick=()=>pick('image/*','photo');$('#mf').onclick=()=>pick('*/*','file');
$('#mv').onclick=async()=>{if(rec){rec.stop();return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());const mt=rec&&rec.mimeType;rec=null;const mv=$('#mv');if(!dlg.open||!mv)return;mv.textContent='Voice';set(new Blob(ch,{type:mt||'audio/webm'}),'voice','Voice note '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}))};rec.start();$('#mv').textContent='Stop'}catch(e){info.textContent='Microphone blocked. Allow it in your browser settings.'}}}
async function mediaShow(it,el){if(!it.media||!el)return;try{const b=await bget(it.media.id);if(!b){el.textContent='The attached file is missing on this device.';return}const u=URL.createObjectURL(b),k=it.media.kind;el.innerHTML=k==='photo'?`<img src="${u}" alt="${E(it.title)}" style="max-width:100%;border-radius:10px;margin-top:12px">`:k==='voice'?`<audio controls src="${u}" style="width:100%;margin-top:12px"></audio>`:`<p><a href="${u}" download="${E(it.media.name)}">Download ${E(it.media.name)}</a></p>`}catch(e){el.textContent='Could not load the attachment.'}}
const SB=[0,1,3,7,16],subj=i=>D.study.find(s=>s.id===i);let dueC=s=>s.cards.filter(c=>c.due<=dk());let mast=s=>s.cards.length?Math.round(100*s.cards.filter(c=>c.box>=3).length/s.cards.length):0;
function study(){if(S.sj){const s=subj(S.sj);if(!s){S.sj=null;return study()}const dc=dueC(s).length;
return`<p><button class="btn" data-a="sbk">Back</button></p><h1>${E(s.name)}</h1><p class="mu" style="margin:0">${pl(s.cards.length,'card')}, ${mast(s)}% mastered</p><div class="row2"><button class="btn p" data-a="rev" data-i="${s.id}" ${dc?'':'disabled'}>Review ${dc} due</button><button class="btn" data-a="addc" data-i="${s.id}">Add card</button><button class="btn" data-a="bulk" data-i="${s.id}">Paste many</button></div>`+(s.cards.length?sec('Cards','<ul>'+s.cards.map(c=>`<li class="row"><button class="rm" data-a="editc" data-i="${s.id}:${c.id}"><b>${E(c.q)}</b><small>${E(c.a)}</small></button></li>`).join('')+'</ul>'):empty('No cards yet','Add a question and answer, or paste many at once as Question | Answer, one per line.'))+`<div class="row2" style="margin-top:32px"><button class="btn d" data-a="delsub" data-i="${s.id}">Delete subject</button></div>`}
const T=D.study.reduce((n,s)=>n+dueC(s).length,0);return`<div style="display:flex;justify-content:space-between;align-items:center"><h1>Study</h1><button class="btn p" data-a="newsub">New subject</button></div><p class="mu" style="margin:0">${T?pl(T,'card')+' due for review today.':'Nothing due today.'}</p>`+(D.study.length?'<ul>'+D.study.map(s=>`<li class="row"><button class="rm" data-a="sub" data-i="${s.id}"><b>${E(s.name)}</b><small>${pl(s.cards.length,'card')}, ${dueC(s).length} due, ${mast(s)}% mastered</small></button></li>`).join('')+'</ul>':empty('No subjects yet','Make a subject like Physics, then add flashcards. Hard cards come back sooner, easy ones later.'))}
function review(sid){const s=subj(sid);const Q=dueC(s).sort(()=>Math.random()-.5),n=Q.length;let sh=0;const step=()=>{if(!Q.length){sheet(`<h2 style="margin:0">Done</h2><p>You reviewed ${n} cards. ${mast(s)}% of this subject is mastered.</p><div class="row2"><button class="btn p" id="rx">Close</button></div>`);$('#rx').onclick=()=>dlg.close();return}const c=Q[0];
sheet(`<small>${Q.length} left</small><p style="font-size:24px;font-weight:600;margin:12px 0">${E(c.q)}</p>${sh?`<p style="font-size:20px">${E(c.a)}</p><div class="row2"><button class="btn d" data-g="0">Again</button><button class="btn p" data-g="1">Good</button><button class="btn" data-g="2">Easy</button></div>`:'<div class="row2"><button class="btn p" id="sa">Show answer</button></div>'}<div class="row2"><button class="btn" id="rq">Stop</button></div>`);
$('#rq').onclick=()=>dlg.close();if(sh)dlg.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=+b.dataset.g;c.box=g?Math.min(4,c.box+g):0;c.due=addD(SB[c.box]);save();Q.shift();if(!g)Q.push(c);sh=0;step()});else $('#sa').onclick=()=>{sh=1;step()}};step()}
function cardSheet(sid,cid){const s=subj(sid),c=cid&&s.cards.find(x=>x.id===cid);sheet(`<h2 style="margin:0">${c?'Edit card':'New card'}</h2><label><span>Question</span><textarea id="cq" rows="3" maxlength="500">${E(c?c.q:'')}</textarea></label><label><span>Answer</span><textarea id="ca" rows="3" maxlength="1000">${E(c?c.a:'')}</textarea></label><div class="row2"><button class="btn p" id="cv">Save</button>${c?'<button class="btn d" id="cd">Delete</button>':''}<button class="btn" id="cz">Cancel</button></div>`);$('#cz').onclick=()=>dlg.close();
$('#cv').onclick=()=>{const q=$('#cq').value.trim(),a=$('#ca').value.trim();if(!q||!a){toast('Fill in both question and answer.');return}if(c){c.q=q;c.a=a}else s.cards.push({id:uid(),q,a,box:0,due:dk()});save();dlg.close()};if(c)$('#cd').onclick=()=>{s.cards=s.cards.filter(x=>x!==c);save();dlg.close()}}
function askAI(q0){let key='';try{key=localStorage.getItem('nexus.key')||''}catch(e){}
sheet(`<h2 style="margin:0">Ask Nexus</h2><p class="mu">Answers from your own notes, tasks and links. Your question and the matching items are sent to Anthropic using your own API key. Nothing else leaves this device.</p><label><span>Your question</span><textarea id="aq" rows="3" maxlength="500">${E(q0||'')}</textarea></label><label><span>Anthropic API key</span><input id="ak" type="password" autocomplete="off" value="${E(key)}" placeholder="sk-ant-..."></label><div class="row2"><button class="btn p" id="ag">Ask</button><button class="btn" id="az">Close</button></div><div id="ar" style="margin-top:14px;white-space:pre-wrap" role="status"></div>`);$('#az').onclick=()=>dlg.close();
$('#ag').onclick=async()=>{const q=$('#aq').value.trim(),k=$('#ak').value.trim(),o=$('#ar');if(!q){o.textContent='Type a question first.';return}if(!k){o.textContent='Paste your Anthropic API key to use Ask Nexus.';return}try{localStorage.setItem('nexus.key',k)}catch(e){}
const tk=[...words(q)],top=D.items.map(i=>{const t=(i.title+' '+i.body+' '+i.tags.join(' ')+' '+pname(i.project)).toLowerCase();return{i,s:tk.filter(w=>t.includes(w)).length}}).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,8).map(x=>x.i),op=D.items.filter(i=>i.type==='task'&&!i.done).slice(0,10);
const cx=[...new Set([...top,...op])].map(i=>`[${i.type}] ${i.title}${i.due?' (due '+i.due+')':''}${pname(i.project)?' project: '+pname(i.project):''}${i.body?'\n'+i.body.slice(0,500):''}${i.url?'\n'+i.url:''}`).join('\n---\n');
o.textContent='Thinking...';$('#ag').disabled=true;
try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:700,system:"You are Nexus, the user's personal assistant. Answer using only the saved items provided. If they do not contain the answer, say so. Be brief and practical.",messages:[{role:'user',content:'My saved items:\n'+cx+'\n\nQuestion: '+q}]})});const j=await res.json();o.textContent=res.ok?j.content.map(c=>c.text||'').join(''):(j.error&&j.error.message)||'The request failed.'}catch(e){o.textContent='Could not reach Anthropic. Check your connection and key.'}$('#ag').disabled=false}}
Object.assign(A,{askai:()=>askAI(),sub:i=>{S.sj=i;render();scrollTo(0,0)},sbk:()=>{S.sj=null;render()},rev:i=>review(i),addc:i=>cardSheet(i),editc:i=>{const[a,b]=i.split(':');cardSheet(a,b)},
newsub:()=>ask('New subject','',n=>{const s={id:uid(),name:n,cards:[]};D.study.push(s);save();S.sj=s.id;render()}),
delsub:i=>{const s=subj(i);if(confirm('Delete '+s.name+' and its '+pl(s.cards.length,'card')+'?')){D.study=D.study.filter(x=>x.id!==i);S.sj=null;save();render()}},
bulk:i=>{const s=subj(i);sheet(`<h2 style="margin:0">Paste many cards</h2><p class="mu">One per line: Question | Answer</p><textarea id="bk2" rows="8" maxlength="20000" aria-label="Cards"></textarea><div class="row2"><button class="btn p" id="bv">Add cards</button><button class="btn" id="bz">Cancel</button></div>`);$('#bz').onclick=()=>dlg.close();
$('#bv').onclick=()=>{let n=0;$('#bk2').value.split('\n').forEach(l=>{const[q,...a]=l.split('|'),ans=a.join('|').trim();if(q&&q.trim()&&ans&&s.cards.length<2000){s.cards.push({id:uid(),q:q.trim(),a:ans,box:0,due:dk()});n++}});save();dlg.close();toast(pl(n,'card')+' added')}}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i)});
document.addEventListener('submit',e=>{if(e.target.id==='qa'){e.preventDefault();const f=e.target.t,p=parse(f.value,'task');if(!p||!p.title){return}addItem(p);render();$('#m input')&&$('#m input').focus()}});
$('#q').addEventListener('input',render);
$('#q').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const v=e.target.value.trim();if(!v)return;const aq=v.match(/^(?:ask\s+|\?\s*)(.+)$/i);if(aq){e.target.value='';render();askAI(aq[1]);return}
const f=v.match(/^focus\s*(\d{1,3})?\b\s*(.*)$/i);if(f){const T=D.items.filter(i=>i.type==='task'&&!i.done);const hit=f[2]?search(f[2]).it.find(i=>i.type==='task'&&!i.done):T[0];if(hit){e.target.value='';render();focus(hit.id,+f[1]||25)}else toast('No open task to focus on. Add one first.');return}
const pv=parse(v),r=search(v);if(pv&&(/^(task|todo|idea|note|remind)\b/i.test(v)||pv.url||(!r.it.length&&!r.pr.length))){const it=addItem(pv);if(it){e.target.value='';render();toast('Saved as '+it.type)}}});

render();
