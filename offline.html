<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Offline - Nexus</title><meta name="description" content="You are offline."><link rel="icon" href="icons/favicon.svg"><link rel="stylesheet" href="fonts.css"><style>:root{color-scheme:dark;--bg:#0D0D0E;--ink:#ECECEA;--mu:#9A9A9F;--ac:#ECECEA}
